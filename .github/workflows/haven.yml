name: Haven backend and dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: haven
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: haven_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U haven -d haven_test" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...
        env:
          HAVEN_TEST_DATABASE_URL: postgres://haven:ci-test-password@127.0.0.1:5432/haven_test?sslmode=disable
          HAVEN_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - run: go build ./cmd/haven
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run typecheck:haven
      - run: npm run build:haven
